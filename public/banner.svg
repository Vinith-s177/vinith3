<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep dark purple -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140226"/>
      <stop offset="50%" stop-color="#1f0238"/>
      <stop offset="100%" stop-color="#0f011d"/>
    </linearGradient>

    <!-- Glowing Dome Gradient -->
    <radialGradient id="domeGrad" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#c026d3" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#86198f" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#581c87" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#140226" stop-opacity="0"/>
    </radialGradient>

    <!-- Dome Top Edge Highlight Gradient -->
    <linearGradient id="domeStrokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="20%" stop-color="#d946ef" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#f0abfc" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#d946ef" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Glow for Title -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Slanted lines stroke gradient -->
    <linearGradient id="accentLinesGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- 1. Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>

  <!-- 2. Central Glowing Dome / Semi-Circle Arch -->
  <!-- Outer soft glow path -->
  <path d="M 180 320 A 420 280 0 0 1 1020 320 Z" fill="url(#domeGrad)"/>
  <!-- Dome border contour -->
  <path d="M 210 320 A 390 260 0 0 1 990 320" fill="none" stroke="url(#domeStrokeGrad)" stroke-width="2"/>

  <!-- 3. Centered Circular Avatar: Cool Octocat with Sunglasses -->
  <g transform="translate(600, 96)">
    <!-- Outer white border ring -->
    <circle cx="0" cy="0" r="44" fill="#1e0538" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="40" fill="#18042c"/>
    
    <!-- Octocat Silhouette (white) -->
    <!-- Head and Ears -->
    <path d="M -24 -6 C -28 -18 -26 -28 -18 -28 C -14 -28 -10 -22 -6 -20 C -2 -21 2 -21 6 -20 C 10 -22 14 -28 18 -28 C 26 -28 28 -18 24 -6 C 29 3 27 15 19 22 C 12 28 -12 28 -19 22 C -27 15 -29 3 -24 -6 Z" fill="#ffffff"/>
    <!-- Body & Shoulders -->
    <path d="M -16 23 C -18 28 -18 36 -14 40 L 14 40 C 18 36 18 28 16 23 Z" fill="#ffffff"/>
    <!-- Tail on left -->
    <path d="M -16 34 C -24 34 -28 28 -27 22 C -26 21 -24 22 -24 24 C -24 27 -22 30 -16 30 Z" fill="#ffffff"/>

    <!-- Sunglasses (Cool dark shades with specular reflection) -->
    <!-- Left Lens -->
    <polygon points="-18,-4 -5,-4 -7,5 -16,5" fill="#0d1117" stroke="#161b22" stroke-width="1.2"/>
    <!-- Right Lens -->
    <polygon points="5,-4 18,-4 16,5 7,5" fill="#0d1117" stroke="#161b22" stroke-width="1.2"/>
    <!-- Bridge -->
    <rect x="-6" y="-3" width="12" height="2.5" fill="#0d1117"/>
    <!-- Left lens reflection shine -->
    <line x1="-15" y1="-2" x2="-10" y2="3" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="-7.5" cy="3" r="0.75" fill="#ffffff" opacity="0.9"/>
    <!-- Right lens reflection shine -->
    <line x1="8" y1="-2" x2="13" y2="3" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="15.5" cy="3" r="0.75" fill="#ffffff" opacity="0.9"/>

    <!-- Cool smile -->
    <path d="M -4 14 Q 0 17 4 14" fill="none" stroke="#0d1117" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- 4. Center Main Heading: HELLO WORLD -->
  <text x="600" y="200" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="3" filter="url(#textGlow)">
    HELLO WORLD
  </text>
  <text x="600" y="200" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="3">
    HELLO WORLD
  </text>

  <!-- Subtitle: WELCOME TO MY PROFILE -->
  <text x="600" y="235" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f5d0fe" letter-spacing="5">
    WELCOME TO MY PROFILE
  </text>

  <!-- 5. Left Side: LinkedIn Profile Link -->
  <g transform="translate(60, 185)">
    <!-- White circle badge with LinkedIn logo -->
    <circle cx="16" cy="0" r="14" fill="#ffffff"/>
    <!-- LinkedIn 'in' logo -->
    <g transform="translate(7.5, -8.5) scale(0.72)">
      <path d="M 4.98 3.5 C 4.98 4.88 3.87 6 2.5 6 C 1.12 6 0 4.88 0 3.5 C 0 2.12 1.12 1 2.5 1 C 3.87 1 4.98 2.12 4.98 3.5 Z M 0.23 8 L 4.77 8 L 4.77 23 L 0.23 23 L 0.23 8 Z M 7.46 8 L 11.81 8 L 11.81 10.05 L 11.87 10.05 C 12.48 8.9 13.96 7.68 16.18 7.68 C 20.79 7.68 21.64 10.71 21.64 14.67 L 21.64 23 L 17.1 23 L 17.1 15.89 C 17.1 14.19 17.07 12.01 14.74 12.01 C 12.37 12.01 12.01 13.85 12.01 15.76 L 12.01 23 L 7.46 23 L 7.46 8 Z" fill="#0a66c2"/>
    </g>

    <!-- Text: LinkedIn profile URL -->
    <text x="40" y="4.5" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#f8fafc" letter-spacing="0.2">
      https://linkedin.com/in/vinith-s-982716390
    </text>
  </g>

  <!-- Bottom Left: 3 Slanted Parallelograms (matching reference screenshot) -->
  <g transform="translate(65, 228)" stroke="url(#accentLinesGrad)" stroke-width="1.6" fill="none">
    <polygon points="0,32 30,0 66,0 36,32"/>
    <polygon points="46,32 76,0 112,0 82,32"/>
    <polygon points="92,32 122,0 158,0 128,32"/>
  </g>

  <!-- 6. Right Side: Email ID -->
  <g transform="translate(850, 185)">
    <!-- White circle badge with Email envelope icon -->
    <circle cx="16" cy="0" r="14" fill="#ffffff"/>
    <!-- Email envelope icon -->
    <g transform="translate(8, -6.5) scale(0.68)">
      <path d="M 3 4 C 1.9 4 1 4.9 1 6 L 1 18 C 1 19.1 1.9 20 3 20 L 21 20 C 22.1 20 23 19.1 23 18 L 23 6 C 23 4.9 22.1 4 21 4 L 3 4 Z M 3 6 L 12 11.6 L 21 6 L 21 7.2 L 12 12.8 L 3 7.2 L 3 6 Z" fill="#140226"/>
    </g>

    <!-- Text: Email Address -->
    <text x="40" y="4.5" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#f8fafc" letter-spacing="0.2">
      gkthana506@gmail.com
    </text>
  </g>

  <!-- Bottom Right: 3 Slanted Parallelograms (matching reference screenshot) -->
  <g transform="translate(930, 228)" stroke="url(#accentLinesGrad)" stroke-width="1.6" fill="none">
    <polygon points="0,32 30,0 66,0 36,32"/>
    <polygon points="46,32 76,0 112,0 82,32"/>
    <polygon points="92,32 122,0 158,0 128,32"/>
  </g>
</svg>
